{% load static %}

<!DOCTYPE html>

<html>

<head>

    <title>HelloApp</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <!-- Navbar -->

    <div class="navbar">

        <h1>HelloApp</h1>

        <div class="icons">

            <span>🔍</span>

            <span>⋮</span>

            <a href="{% url 'logout' %}">Logout</a>

        </div>

    </div>


    <!-- Search Box -->

    <div class="search-box">

        <input
            type="text"
            placeholder="Search or start new chat"
        >

    </div>


    <!-- Users / Chats -->

    {% for user in users %}

        <a
            href="{% url 'chat_page' user.id %}"
            class="chat-link"
        >

            <div class="chat">

                <!-- Profile -->

                <div class="profile">

                    <img
                        class="profile-img"
                        src="{% static 'images/profile.jpg.jpg' %}"
                        alt="Profile"
                    >

                </div>


                <!-- User Information -->

                <div class="message">

                    <h3>
                        {{ user.username }}
                    </h3>

                    <p>
                        Start a conversation
                    </p>

                </div>


                <!-- Time -->

                <div class="time">

                    <div>
                        —
                    </div>

                </div>

            </div>

        </a>

    {% empty %}

        <p style="text-align: center;">
            No users found.
        </p>

    {% endfor %}


</body>

</html>
