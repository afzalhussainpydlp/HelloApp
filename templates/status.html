{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - HelloApp</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f0f2f5;min-height:100vh;}

        .wrap{max-width:560px;margin:0 auto;padding:12px;}
        .section{color:#128C7E;font-size:13px;font-weight:600;margin:18px 6px 8px;}

        .row{display:flex;align-items:center;gap:14px;background:#fff;padding:12px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);}
        .row:hover{background:#fafafa;}
        .row .info{flex:1;min-width:0;}
        .row .name{font-weight:600;color:#111b21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .row .sub{font-size:13px;color:#667781;margin-top:2px;}

        .avatar{position:relative;width:54px;height:54px;border-radius:50%;flex-shrink:0;padding:3px;border:3px solid transparent;}
        .avatar.unseen{border-color:#25D366;}
        .avatar.seen{border-color:#c4c9cc;}
        .avatar img,.avatar .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#e4e8ec;display:flex;align-items:center;justify-content:center;font-size:22px;}
        .avatar .plus{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#25D366;color:#fff;font-size:16px;line-height:22px;text-align:center;border:2px solid #fff;}

        .add-btn{width:40px;height:40px;border:none;border-radius:50%;background:#e7f8ee;color:#128C7E;font-size:22px;cursor:pointer;}
        .empty{text-align:center;color:#667781;padding:30px 20px;font-size:14px;line-height:1.5;}

        /* ---- naya status likhne ka popup ---- */
        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;align-items:center;justify-content:center;padding:16px;}
        .overlay.show{display:flex;}
        .sheet{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.3);max-height:94vh;overflow:auto;}
        .sheet h3{color:#075E54;margin-bottom:12px;}
        .preview{height:200px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:22px;padding:16px;overflow:hidden;background-position:center;background-size:cover;word-break:break-word;position:relative;}
        .preview .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);font-size:15px;padding:8px 12px;}
        textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid #d1d7db;border-radius:10px;padding:10px;margin-top:12px;resize:none;height:70px;outline:none;}
        textarea:focus{border-color:#25D366;}
        .count{text-align:right;font-size:12px;color:#8696a0;}
        .swatches{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
        .sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c4c9cc;cursor:pointer;}
        .sw.on{box-shadow:0 0 0 2px #25D366;}
        .tools{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
        .tools button.photo{border:1.5px solid #25D366;color:#128C7E;background:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px;}
        .tools .rm{border:none;background:none;color:#b3261e;cursor:pointer;font-size:13px;display:none;}
        .err{background:#fdecea;color:#b3261e;padding:9px 12px;border-radius:8px;font-size:13.5px;margin-bottom:10px;}
        .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;}
        .btns button{padding:10px 20px;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;}
        .btns .cancel{background:#eef1f3;color:#41525d;}
        .btns .post{background:#25D366;color:#fff;}

        /* ---- status dekhne wala full screen viewer ---- */
        #viewer{display:none;position:fixed;inset:0;background:#000;z-index:50;color:#fff;flex-direction:column;}
        #viewer.show{display:flex;}
        #bars{display:flex;gap:4px;padding:10px 10px 6px;}
        #bars .bar{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;}
        #bars .bar i{display:block;height:100%;width:0;background:#fff;}
        #bars .bar.done i{width:100%;}
        #bars .bar.now i{animation:fill linear forwards;}
        @keyframes fill{from{width:0}to{width:100%}}
        #vhead{display:flex;align-items:center;gap:10px;padding:6px 12px;}
        #vhead img,#vhead .ph{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#37474f;display:flex;align-items:center;justify-content:center;}
        #vhead .t b{display:block;font-size:15px;}
        #vhead .t small{opacity:.75;font-size:12px;}
        #vclose{margin-left:auto;border:none;background:none;color:#fff;font-size:28px;cursor:pointer;padding:0 6px;}
        #vbody{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
        #vbody img{max-width:100%;max-height:100%;object-fit:contain;}
        #vtext{padding:24px;font-size:28px;text-align:center;word-break:break-word;max-width:100%;}
        #vcap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:rgba(0,0,0,.5);text-align:center;font-size:16px;}
        #vtext.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
        #vfoot{display:none;padding:10px 16px;align-items:center;justify-content:space-between;background:rgba(0,0,0,.6);}
        #vfoot.show{display:flex;}
        #vfoot button{border:none;background:none;color:#fff;font-size:15px;cursor:pointer;}
        #viewers{display:none;background:#fff;color:#111b21;padding:14px 18px;max-height:40vh;overflow:auto;}
        #viewers.show{display:block;}
        #viewers h4{color:#128C7E;margin-bottom:8px;}
        #viewers li{list-style:none;padding:6px 0;border-bottom:1px solid #eef0f2;}
    </style>
</head>
<body data-status-ms="5000">

    {% include "page_header.html" with active="status" %}

    <div class="wrap">
        <div id="myRow"></div>
        <div class="section">Recent updates</div>
        <div id="recent"></div>
    </div>

    <!-- Naya status likhna -->
    <div class="overlay" id="composeOverlay">
        <form class="sheet" method="POST" enctype="multipart/form-data" id="composeForm">
            {% csrf_token %}
            <h3>New status</h3>

            {% if error %}<p class="err" id="serverError">{{ error }}</p>{% endif %}
            <p class="err" id="clientError" style="display:none"></p>

            <div class="preview" id="preview"><span id="previewText">Type something...</span><div class="cap" id="previewCap" style="display:none"></div></div>

            <textarea name="text" id="text" maxlength="300" placeholder="What's on your mind?">{{ text_value }}</textarea>
            <div class="count"><span id="textCount">0</span>/300</div>

            <div class="swatches" id="swatches"></div>
            <input type="hidden" name="bg" id="bg" value="">

            <div class="tools">
                <button type="button" class="photo" id="photoBtn">&#128247; Add photo</button>
                <button type="button" class="rm" id="photoRemove">Remove photo</button>
                <input type="file" name="image" id="image" accept="image/*" hidden>
            </div>

            <div class="btns">
                <button type="button" class="cancel" id="composeCancel">Cancel</button>
                <button type="submit" class="post">Post</button>
            </div>
        </form>
    </div>

    <!-- Full screen status viewer -->
    <div id="viewer">
        <div id="bars"></div>
        <div id="vhead">
            <div id="vavatar"></div>
            <div class="t"><b id="vname"></b><small id="vtime"></small></div>
            <button id="vclose" type="button" aria-label="Close">&times;</button>
        </div>
        <div id="vbody"></div>
        <div id="vfoot">
            <button id="vviewers" type="button">&#128065; <span id="vcount">0</span></button>
            <button id="vdelete" type="button">&#128465; Delete</button>
        </div>
        <div id="viewers"><h4>Viewed by</h4><ul id="viewersList"></ul></div>
    </div>

    {{ status_data|json_script:"status-data" }}

    {% include "presence_socket.html" %}

    <script>
        const data = JSON.parse(document.getElementById("status-data").textContent);
        const groups = data.groups;                 // groups[0] hamesha "mera status" hai
        const COLORS = data.colors;
        const STATUS_MS = Number(document.body.dataset.statusMs || 5000);
        const CSRF = "{{ csrf_token }}";
        const hasError = {% if error %}true{% else %}false{% endif %};

        const $ = (id) => document.getElementById(id);

        // ---------- chhote helpers ----------
        function when(iso) {
            const d = new Date(iso), now = new Date();
            const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            if (d.toDateString() === now.toDateString()) return "Today, " + time;
            const y = new Date(); y.setDate(now.getDate() - 1);
            if (d.toDateString() === y.toDateString()) return "Yesterday, " + time;
            return d.toLocaleDateString() + ", " + time;
        }

        function avatarEl(group, ringClass, plus) {
            const box = document.createElement("div");
            box.className = "avatar " + (ringClass || "");
            if (group.dp) {
                const img = document.createElement("img"); img.src = group.dp; img.alt = ""; box.appendChild(img);
            } else {
                const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "\uD83D\uDC64"; box.appendChild(ph);
            }
            if (plus) { const p = document.createElement("span"); p.className = "plus"; p.textContent = "+"; box.appendChild(p); }
            return box;
        }

        // ---------- list: mera status + doston ke status ----------
        function renderList() {
            const mine = groups[0];
            const myRow = $("myRow");
            myRow.innerHTML = "";

            const row = document.createElement("div");
            row.className = "row"; row.id = "myStatusRow";
            row.appendChild(avatarEl(mine, mine.items.length ? "unseen" : "", !mine.items.length));

            const info = document.createElement("div"); info.className = "info";
            const name = document.createElement("div"); name.className = "name"; name.textContent = "My status";
            const sub = document.createElement("div"); sub.className = "sub";
            sub.textContent = mine.items.length
                ? mine.items.length + (mine.items.length === 1 ? " update" : " updates") + " \u00B7 " + when(mine.items[mine.items.length - 1].created_at)
                : "Tap to add status update";
            info.appendChild(name); info.appendChild(sub); row.appendChild(info);

            const add = document.createElement("button");
            add.className = "add-btn"; add.id = "addBtn"; add.type = "button"; add.textContent = "+"; add.setAttribute("aria-label", "Add status");
            add.addEventListener("click", function (e) { e.stopPropagation(); openCompose(); });
            row.appendChild(add);

            row.addEventListener("click", function () { mine.items.length ? openViewer(0, 0) : openCompose(); });
            myRow.appendChild(row);

            const recent = $("recent");
            recent.innerHTML = "";
            let count = 0;
            groups.forEach(function (g, gi) {
                if (g.mine || !g.items.length) return;
                count++;
                const unseen = g.items.some(function (i) { return !i.viewed; });
                const r = document.createElement("div");
                r.className = "row"; r.dataset.userId = g.user_id;
                r.appendChild(avatarEl(g, unseen ? "unseen" : "seen"));
                const inf = document.createElement("div"); inf.className = "info";
                const nm = document.createElement("div"); nm.className = "name"; nm.textContent = g.name;
                const sb = document.createElement("div"); sb.className = "sub"; sb.textContent = when(g.items[g.items.length - 1].created_at);
                inf.appendChild(nm); inf.appendChild(sb); r.appendChild(inf);
                r.addEventListener("click", function () {
                    const first = g.items.findIndex(function (i) { return !i.viewed; });
                    openViewer(gi, first === -1 ? 0 : first);
                });
                recent.appendChild(r);
            });
            if (!count) {
                const e = document.createElement("div"); e.className = "empty";
                e.textContent = "No recent updates. Statuses of people you chat with show up here for 24 hours.";
                recent.appendChild(e);
            }
        }

        // ---------- viewer ----------
        let gi = 0, ii = 0, timer = null;

        function openViewer(g, i) { gi = g; ii = i; $("viewer").classList.add("show"); showItem(); }

        function closeViewer() {
            clearTimeout(timer);
            $("viewer").classList.remove("show");
            $("viewers").classList.remove("show");
            renderList();                                   // dekhne ke baad ring grey ho jaye
        }

        function showItem() {
            clearTimeout(timer);
            $("viewers").classList.remove("show");
            const g = groups[gi], it = g.items[ii];

            // progress bars
            const bars = $("bars"); bars.innerHTML = "";
            g.items.forEach(function (_, k) {
                const b = document.createElement("div"); b.className = "bar" + (k < ii ? " done" : k === ii ? " now" : "");
                const fill = document.createElement("i");
                if (k === ii) fill.style.animationDuration = STATUS_MS + "ms";
                b.appendChild(fill); bars.appendChild(b);
            });

            // header
            const av = $("vavatar"); av.innerHTML = "";
            if (g.dp) { const im = document.createElement("img"); im.src = g.dp; im.alt = ""; av.appendChild(im); }
            else { const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "\uD83D\uDC64"; av.appendChild(ph); }
            $("vname").textContent = g.mine ? "My status" : g.name;
            $("vtime").textContent = when(it.created_at);

            // content: photo (caption ke saath) ya rangeen text
            const body = $("vbody"); body.innerHTML = "";
            body.style.background = it.image ? "#000" : it.bg;
            if (it.image) {
                const im = document.createElement("img"); im.src = it.image; im.alt = "Status"; body.appendChild(im);
                if (it.text) { const c = document.createElement("div"); c.id = "vcap"; c.textContent = it.text; body.appendChild(c); }
            } else {
                const t = document.createElement("div"); t.id = "vtext"; t.className = "full"; t.textContent = it.text; body.appendChild(t);
            }

            // mera status: dekhne wale + delete
            const foot = $("vfoot");
            foot.classList.toggle("show", g.mine);
            if (g.mine) {
                $("vcount").textContent = it.viewers.length;
                const ul = $("viewersList"); ul.innerHTML = "";
                if (!it.viewers.length) { const li = document.createElement("li"); li.textContent = "No views yet"; ul.appendChild(li); }
                it.viewers.forEach(function (n) { const li = document.createElement("li"); li.textContent = n; ul.appendChild(li); });
            }

            // doosre ka status pehli baar dekha: server ko batao
            if (!g.mine && !it.viewed) {
                it.viewed = true;
                fetch("/status/" + it.id + "/view/", { method: "POST", headers: { "X-CSRFToken": CSRF }, credentials: "same-origin" });
            }

            timer = setTimeout(next, STATUS_MS);             // apne aap agla
        }

        function next() {
            const g = groups[gi];
            if (ii < g.items.length - 1) { ii++; return showItem(); }
            // is dost ke status khatam: agle dost par (mera status chhod ke)
            for (let k = gi + 1; k < groups.length; k++) {
                if (!groups[k].mine && groups[k].items.length) { gi = k; ii = 0; return showItem(); }
            }
            closeViewer();
        }

        function prev() {
            if (ii > 0) { ii--; }
            showItem();
        }

        $("vbody").addEventListener("click", function (e) {
            (e.clientX < window.innerWidth / 3) ? prev() : next();
        });
        $("vclose").addEventListener("click", closeViewer);
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") { $("composeOverlay").classList.remove("show"); if ($("viewer").classList.contains("show")) closeViewer(); }
            if ($("viewer").classList.contains("show")) {
                if (e.key === "ArrowRight") next();
                if (e.key === "ArrowLeft") prev();
            }
        });

        $("vviewers").addEventListener("click", function () {
            const box = $("viewers");
            box.classList.toggle("show");
            if (box.classList.contains("show")) clearTimeout(timer);       // list dekhte waqt ruko
            else timer = setTimeout(next, STATUS_MS);
        });

        $("vdelete").addEventListener("click", async function () {
            if (!confirm("Delete this status?")) return;
            const g = groups[gi], it = g.items[ii];
            await fetch("/status/" + it.id + "/delete/", { method: "POST", headers: { "X-CSRFToken": CSRF }, credentials: "same-origin" });
            g.items.splice(ii, 1);
            if (!g.items.length) return closeViewer();
            if (ii >= g.items.length) ii = g.items.length - 1;
            showItem();
        });

        // ---------- naya status likhna ----------
        const text = $("text"), bg = $("bg"), preview = $("preview"), imageInput = $("image");
        const MAX_IMAGE_MB = 5;
        let photoUrl = "";

        COLORS.forEach(function (c, k) {
            const s = document.createElement("div");
            s.className = "sw"; s.style.background = c; s.dataset.color = c;
            s.addEventListener("click", function () { pickColor(c); });
            $("swatches").appendChild(s);
        });

        function pickColor(c) {
            bg.value = c;
            document.querySelectorAll(".sw").forEach(function (s) { s.classList.toggle("on", s.dataset.color === c); });
            drawPreview();
        }

        function drawPreview() {
            const t = text.value.trim();
            $("textCount").textContent = text.value.length;
            if (photoUrl) {
                preview.style.backgroundImage = "url('" + photoUrl + "')";
                preview.style.backgroundColor = "#000";
                $("previewText").textContent = "";
                const cap = $("previewCap"); cap.style.display = t ? "block" : "none"; cap.textContent = t;
            } else {
                preview.style.backgroundImage = "";
                preview.style.backgroundColor = bg.value;
                $("previewText").textContent = t || "Type something...";
                $("previewCap").style.display = "none";
            }
        }

        function openCompose() { $("composeOverlay").classList.add("show"); text.focus(); }
        function closeCompose() { $("composeOverlay").classList.remove("show"); }

        text.addEventListener("input", drawPreview);
        $("composeCancel").addEventListener("click", closeCompose);
        $("composeOverlay").addEventListener("click", function (e) { if (e.target === $("composeOverlay")) closeCompose(); });

        $("photoBtn").addEventListener("click", function () { imageInput.click(); });
        imageInput.addEventListener("change", function () {
            const f = imageInput.files[0];
            if (!f) return;
            if (!f.type.startsWith("image/") || f.size > MAX_IMAGE_MB * 1024 * 1024) {
                alert(!f.type.startsWith("image/") ? "Please choose a photo." : "Photo must be under " + MAX_IMAGE_MB + " MB.");
                imageInput.value = ""; return;
            }
            const reader = new FileReader();
            reader.onload = function (e) { photoUrl = e.target.result; $("photoRemove").style.display = "inline"; drawPreview(); };
            reader.readAsDataURL(f);
        });
        $("photoRemove").addEventListener("click", function () {
            photoUrl = ""; imageInput.value = ""; $("photoRemove").style.display = "none"; drawPreview();
        });

        $("composeForm").addEventListener("submit", function (e) {
            if (!text.value.trim() && !imageInput.files.length) {
                e.preventDefault();
                const err = $("clientError"); err.textContent = "Write something or choose a photo."; err.style.display = "block";
            }
        });

        // ---------- shuruaat ----------
        pickColor(COLORS[0]);
        text.value.length && drawPreview();
        renderList();
        if (hasError) openCompose();
    </script>

</body>
</html>
